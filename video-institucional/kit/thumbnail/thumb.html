<!doctype html><html><head><meta charset="utf-8"><style>
      @font-face { font-family: "Montserrat"; font-weight: 400; src: url("assets/fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url("assets/fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }

      :root {
        --azul-escuro: #1c3665;
        --azul-medio: #106db6;
        --azul-claro: #689ccb;
        --amarelo: #feda0c;
        --branco-suave: #f4f5fa;
        --azul-gris: #d4eaff;
        --preto-azulado: #0e1a31;
        --grafite: #1e1e1e;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--preto-azulado); font-family: var(--font); color: var(--branco-suave); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* ---------- fundo: gradiente + brilho no horizonte + malha 3D ---------- */
      .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #1c3665 0%, #142a52 45%, #0e1a31 100%); }
      .glow { position: absolute; left: 50%; top: 58%; width: 2200px; height: 700px; transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(16,109,182,0.55) 0%, rgba(16,109,182,0.18) 35%, rgba(16,109,182,0) 70%); }
      .mesh-wrap { position: absolute; left: 0; right: 0; top: 560px; height: 620px; perspective: 900px; perspective-origin: 50% 0%; overflow: hidden;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 22%, rgba(0,0,0,1) 70%, rgba(0,0,0,0.15) 100%); mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 22%, rgba(0,0,0,1) 70%, rgba(0,0,0,0.15) 100%); }
      .mesh { position: absolute; left: -50%; top: 0; width: 200%; height: 1400px; transform-origin: 50% 0%; transform: rotateX(62deg);
        background-image:
          linear-gradient(90deg, rgba(104,156,203,0.28) 0 2px, transparent 2px 100%),
          linear-gradient(0deg, rgba(104,156,203,0.28) 0 2px, transparent 2px 100%);
        background-size: 110px 110px, 110px 110px; }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(14,26,49,0.55) 100%); }

      /* ---------- moldura fixa ---------- */
      .frame { position: absolute; inset: 0; pointer-events: none; }
      .logo { position: absolute; left: 96px; bottom: 64px; width: 280px; height: auto; }
      .kicker { position: absolute; right: 96px; top: 76px; font-size: 22px; font-weight: 600; letter-spacing: 0.18em; color: var(--azul-claro); text-transform: uppercase; }
      .progress { position: absolute; left: 0; bottom: 0; width: 1920px; height: 8px; background: rgba(104,156,203,0.18); }
      .progress .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(90deg, var(--azul-medio), var(--azul-claro)); transform-origin: 0 50%; transform: scaleX(0); }

      /* ---------- cenas ---------- */
      .scene { position: absolute; inset: 0; opacity: 0; }
      .label { position: absolute; left: 96px; top: 64px; display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 22px; border: 2px solid var(--azul-claro); border-radius: 999px; font-size: 22px; font-weight: 700; letter-spacing: 0.16em; color: var(--azul-gris); text-transform: uppercase; }
      .label svg { width: 24px; height: 24px; stroke: var(--azul-claro); }
      .title { position: absolute; left: 96px; top: 150px; font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase; color: #fff; }
      .title em { font-style: normal; color: var(--amarelo); }
      .sub { position: absolute; left: 96px; top: 236px; font-size: 30px; font-weight: 500; color: var(--azul-gris); }
      .a { opacity: 0; } /* elementos animados entram invisíveis */

      .card { position: absolute; border-radius: 28px; background: rgba(28,54,101,0.72); border: 2px solid rgba(104,156,203,0.45); padding: 36px 40px; }
      .card.solid { background: var(--azul-medio); border-color: var(--azul-medio); }
      .card.light { background: var(--branco-suave); color: var(--grafite); border-color: var(--branco-suave); }
      .card h3 { font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; }
      .card p { font-size: 28px; font-weight: 500; line-height: 1.3; color: var(--azul-gris); }
      .card.light p { color: #33415c; }
      .big { font-size: 150px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #fff; }
      .pill { display: inline-flex; align-items: center; gap: 14px; height: 60px; padding: 0 26px; border-radius: 999px; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: rgba(104,156,203,0.18); border: 2px solid var(--azul-claro); color: #fff; white-space: nowrap; }
      .pill svg { width: 30px; height: 30px; stroke: var(--amarelo); flex: none; }
      .pill.yellow { background: var(--amarelo); border-color: var(--amarelo); color: var(--grafite); }
      .pill.yellow svg { stroke: var(--grafite); }
      .pill.solid { background: var(--azul-medio); border-color: var(--azul-medio); }
      .row { position: absolute; display: flex; gap: 20px; }
      .strike { position: relative; display: inline-block; }
      .strike .line { position: absolute; left: -4%; top: 50%; width: 108%; height: 8px; background: var(--amarelo); transform: translateY(-50%) scaleX(0); transform-origin: 0 50%; border-radius: 4px; }
      .ico { width: 56px; height: 56px; stroke: var(--amarelo); flex: none; }
      .ico.blue { stroke: var(--azul-claro); }
      .check { width: 48px; height: 48px; stroke: var(--amarelo); flex: none; }
      .num { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: var(--amarelo); color: var(--grafite); font-size: 38px; font-weight: 800; flex: none; }
      .stamp { position: absolute; padding: 18px 36px; border: 6px solid var(--amarelo); border-radius: 18px; color: var(--amarelo); font-size: 54px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; transform: rotate(-6deg); background: rgba(14,26,49,0.75); }
      .stamp.red { border-color: #ff6b6b; color: #ff6b6b; }
      .small { font-size: 22px; font-weight: 600; color: var(--azul-claro); letter-spacing: 0.08em; text-transform: uppercase; }

      
      .title { top: 140px; font-size: 56px; }
      .sub { top: 222px; }
      .list { position: absolute; left: 96px; width: 1728px; display: flex; flex-direction: column; gap: 18px; }
      .li { display: flex; align-items: center; gap: 28px; min-height: 104px; padding: 18px 34px; border-radius: 22px; background: rgba(28,54,101,0.78); border: 2px solid rgba(104,156,203,0.45); font-size: 32px; font-weight: 600; line-height: 1.3; color: var(--azul-gris); }
      .li b { color: #fff; font-weight: 800; }
      .list.lbig .li { min-height: 150px; font-size: 31px; }
      .li .ico { width: 52px; height: 52px; }
      .cards { position: absolute; left: 96px; width: 1728px; display: flex; gap: 24px; align-items: stretch; }
      .cards .card { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 34px 40px; }
      .cards .card .ico { width: 64px; height: 64px; }
      .cards .card h3 { font-size: 36px; color: #fff; }
      .cards .card p { font-size: 28px; }
      .cards .card.solid p { color: #eaf3ff; }
      .cards .card.solid .ico { stroke: var(--amarelo); }
      .steps .arrow { flex: none; width: 64px; display: flex; align-items: center; justify-content: center; }
      .steps .arrow svg { width: 60px; height: 60px; stroke: var(--amarelo); }
      .banner { position: absolute; left: 96px; width: 1728px; display: flex; align-items: center; gap: 28px; padding: 26px 36px; border-radius: 24px; background: var(--azul-medio); font-size: 32px; font-weight: 600; line-height: 1.3; }
      .banner b { color: var(--amarelo); font-weight: 800; }
      .banner .ico { width: 56px; height: 56px; }
      .nums { position: absolute; left: 96px; width: 1728px; display: flex; gap: 20px; }
      .nm { flex: 1; height: 150px; border-radius: 22px; background: rgba(28,54,101,0.85); border: 2px solid rgba(104,156,203,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .nm b { font-size: 64px; font-weight: 800; color: var(--amarelo); line-height: 1; }
      .nm span { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--azul-gris); }
      .spec { position: absolute; left: 96px; width: 1728px; display: flex; gap: 20px; }
      .sp { flex: 1; height: 180px; border-radius: 22px; background: var(--branco-suave); color: var(--grafite); display: flex; align-items: center; gap: 20px; padding: 0 28px; font-size: 32px; font-weight: 800; line-height: 1.15; }
      .sp .k { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; background: var(--azul-medio); color: #fff; font-size: 30px; flex: none; }
      .lights { position: absolute; left: 96px; width: 1728px; display: flex; gap: 24px; }
      .lt { flex: 1; height: 320px; border-radius: 24px; background: rgba(28,54,101,0.82); border: 2px solid rgba(104,156,203,0.45); padding: 30px 34px; display: flex; flex-direction: column; gap: 22px; }
      .lt .dot { width: 84px; height: 84px; border-radius: 50%; flex: none; }
      .lt h3 { font-size: 40px; font-weight: 800; text-transform: uppercase; }
      .lt p { margin-top: 8px; font-size: 28px; font-weight: 500; line-height: 1.3; color: var(--azul-gris); }
      .weeks { position: absolute; left: 96px; width: 1728px; }
      .wk { position: absolute; top: 0; border-radius: 18px; background: rgba(14,26,49,0.55); border: 2px solid rgba(104,156,203,0.3); }
      .wk .wn { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; color: var(--azul-claro); }
      .wi { position: absolute; border-radius: 16px; background: rgba(28,54,101,0.95); border: 2px solid var(--azul-claro); padding: 18px 14px; font-size: 24px; font-weight: 700; line-height: 1.3; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; }
      .wi.tp { background: var(--azul-medio); border-color: var(--azul-medio); font-size: 26px; }
      .wi.at { background: var(--amarelo); border-color: var(--amarelo); color: var(--grafite); font-size: 26px; }
      .wi.v { background: rgba(104,156,203,0.35); font-size: 22px; }
      .shot { position: absolute; left: 96px; width: 1728px; border-radius: 22px; overflow: hidden; background: #f3f5f9; border: 3px solid rgba(104,156,203,0.6); box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
      .stage { position: absolute; left: 0; top: 0; width: 2048px; height: 1920px; transform-origin: 0 0; }
      .stage img { position: absolute; left: 0; top: 0; width: 2048px; height: 1920px; }
      .mark { position: absolute; border: 6px solid var(--amarelo); border-radius: 16px; background: rgba(254,218,12,0.10); box-shadow: 0 0 24px rgba(254,218,12,0.55); }
      .final { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #1c3665 0%, #142a52 50%, #0e1a31 100%); }
      .final img { width: 560px; height: auto; }
:root { --amarelo: #FEDA0C; --acc: #FEDA0C; --ink: #0b1630; --glass: linear-gradient(155deg, rgba(46,86,152,0.72) 0%, rgba(22,46,92,0.78) 60%, rgba(16,34,70,0.82) 100%); --line: rgba(170,205,255,0.26); }
.bg2 { position: absolute; inset: 0; background: linear-gradient(165deg, #1d3a6e 0%, #142a54 42%, #0b1630 100%); overflow: hidden; }
.bg2 .a1 { position: absolute; right: -260px; top: -320px; width: 1300px; height: 1000px; border-radius: 50%; background: radial-gradient(closest-side, rgba(16,109,182,0.62), rgba(16,109,182,0)); }
.bg2 .a2 { position: absolute; left: -300px; bottom: -420px; width: 1100px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(104,156,203,0.30), rgba(104,156,203,0)); }
.bg2 .a3 { position: absolute; left: 30%; top: 46%; width: 900px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(254,218,12,0.07), rgba(254,218,12,0)); }
.bg2 .orb { position: absolute; right: -420px; top: -420px; width: 1500px; height: 1500px; border-radius: 50%; border: 2px solid rgba(160,200,255,0.10); }
.bg2 .orb.o2 { right: -260px; top: -260px; width: 1180px; height: 1180px; border-style: dashed; border-color: rgba(160,200,255,0.13); }
.bg2 .grain { position: absolute; inset: 0; opacity: 0.10; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.sc { position: absolute; inset: 0; }
.ico { stroke: var(--acc); }
.wm { position: absolute; right: 84px; top: 4px; font-size: 300px; font-weight: 800; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(150,195,250,0.17); letter-spacing: -0.04em; }
.lab { position: absolute; left: 96px; top: 70px; height: 46px; padding: 0 20px 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--azul-gris); background: rgba(255,255,255,0.06); border: 1.5px solid var(--line); }
.lab .ico { width: 24px; height: 24px; }
.ttl { position: absolute; left: 96px; top: 134px; font-size: 66px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.08; text-transform: uppercase; white-space: nowrap; }
.ttl em { font-style: normal; color: var(--acc); position: relative; }
.ttl em::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 6px; border-radius: 3px; background: var(--acc); opacity: 0.9; }
.g { position: absolute; border-radius: 30px; background: var(--glass); border: 1.5px solid var(--line); box-shadow: 0 30px 70px rgba(4,10,26,0.42), inset 0 1px 0 rgba(255,255,255,0.14); }
.g.hi { border-color: var(--acc); box-shadow: 0 30px 70px rgba(4,10,26,0.42), 0 0 0 4px rgba(254,218,12,0.12), inset 0 1px 0 rgba(255,255,255,0.14); }
.cap { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--azul-claro); }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px; border-radius: 999px; font-size: 23px; font-weight: 700; background: rgba(255,255,255,0.07); border: 1.5px solid var(--line); white-space: nowrap; }
.chip .ico { width: 28px; height: 28px; } .chip.y { background: var(--acc); color: #17202e; border-color: var(--acc); } .chip.y .ico { stroke: #17202e; }
.chip.r { border-color: #ff7a7a; color: #ffb3b3; } .chip.r .ico { stroke: #ff7a7a; }
.abs { position: absolute; }
.photo { position: absolute; border-radius: 28px; overflow: hidden; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 34px 80px rgba(4,10,26,0.55); background: linear-gradient(140deg, #1f4c8f, #0f2a5a 55%, #173e7a), repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 14px, transparent 14px 28px); }
.photo::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 16px, transparent 16px 32px); }
.photo .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--azul-gris); font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; padding: 0 30px; }
.photo .ph .ico { width: 70px; height: 70px; stroke: var(--azul-claro); } .photo .ph small { font-size: 17px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; opacity: 0.85; }
.logo2 { position: absolute; left: 96px; bottom: 58px; width: 270px; }
.prog { position: absolute; left: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #106db6, #689ccb); }
.narr { position: absolute; left: 1560px; top: 720px; width: 300px; height: 300px; border-radius: 50%; }
.narr .in { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 6px solid var(--acc); box-shadow: 0 22px 60px rgba(0,0,0,0.55); }
.narr .in img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.14) translateX(3%); }
.narr .gl { position: absolute; inset: -16px; border-radius: 50%; border: 4px solid var(--acc); opacity: 0.45; box-shadow: 0 0 40px rgba(254,218,12,0.5); }
.narr.big { left: 660px; top: 120px; width: 600px; height: 600px; } .narr.big .in { border-width: 10px; } .narr.big .gl { inset: -28px; border-width: 6px; }
/* 1 gancho */
.h-s { position: absolute; left: 140px; font-size: 50px; font-weight: 500; color: var(--azul-gris); }
.h-b { position: absolute; left: 136px; font-size: 118px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
.h-b.dim { color: rgba(244,245,250,0.42); } .h-b.dim::after { content: ""; position: absolute; left: -16px; right: -16px; top: 52%; height: 12px; border-radius: 6px; background: var(--acc); }
.h-b.y { color: var(--acc); font-size: 150px; text-shadow: 0 0 80px rgba(254,218,12,0.28); }
.ring { position: absolute; border-radius: 50%; border: 3px solid var(--acc); }
.live { position: absolute; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-radius: 999px; background: #e5383b; color: #fff; font-size: 21px; font-weight: 800; letter-spacing: 0.12em; box-shadow: 0 10px 26px rgba(229,56,59,0.45); }
.live i { width: 12px; height: 12px; border-radius: 50%; background: #fff; }
/* 2 trilha */
